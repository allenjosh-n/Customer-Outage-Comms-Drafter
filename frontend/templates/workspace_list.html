<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OutageComms — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-pulse pulse--low"></div>
        <div class="brand-divider"></div>
        <span class="brand-name">OutageComms</span>
      </div>
      <nav class="header-nav">
        <a href="/" class="nav-link">Incident Drafter</a>
        <a href="/workspace-page" class="nav-link nav-link--active">Workspace</a>
      </nav>
      <div class="header-right">
        <div class="user-info" id="userInfo">
          <div class="user-avatar" id="userAvatar"></div>
          <span class="user-name" id="userName"></span>
          <button class="logout-btn" onclick="logout()">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="ws-main">
    <div class="ws-list-header">
      <div>
        <span class="panel-eyebrow">Collaborative</span>
        <h1 class="panel-title">Incident Workspace</h1>
        <p class="panel-desc">Create shared incidents where multiple Incident Managers can collaborate in real time.</p>
      </div>
      <button class="generate-btn ws-new-btn" id="newWsBtn" onclick="openNewModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Incident
      </button>
    </div>

    <div id="wsList" class="ws-grid">
      <p class="placeholder-text" style="grid-column:1/-1;padding:var(--space-8);text-align:center">Loading workspaces…</p>
    </div>
  </main>

  <!-- New Incident Modal -->
  <div id="modalOverlay" class="modal-overlay" onclick="closeNewModal()"></div>
  <div id="newWsModal" class="modal-card">
    <h2 class="modal-title">New Incident Workspace</h2>
    <div id="modalError" class="auth-error" style="display:none"></div>
    <div class="field-group">
      <label class="field-label" for="wsTitle">Incident Title</label>
      <input type="text" id="wsTitle" class="auth-input" placeholder="e.g. Payment Gateway Outage" />
    </div>
    <div class="field-group">
      <label class="field-label" for="wsSeverity">Severity</label>
      <div class="select-wrapper">
        <select id="wsSeverity" class="field-select">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
        <span class="select-icon">&#8595;</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="reset-btn" style="flex:1" onclick="closeNewModal()">Cancel</button>
      <button class="generate-btn" style="flex:1" onclick="createWorkspace()">
        <span id="createLabel">Create</span>
        <span class="btn-loader" id="createLoader"></span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/workspace.js') }}"></script>
</body>
</html>
